services:
  - type: web
    name: spotter-route-finder
    runtime: python
    plan: free
    buildCommand: |
      cd frontend && npm ci && npm run build && cd ..
      pip install -r backend/requirements.txt
      cd backend && python -m whitenoise.compress ../frontend/dist && python manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn config.wsgi --workers 2 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: 22
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ORIGINS
        value: https://spotter-route-finder.onrender.com
